name: Check documentation
on:
  push:
    paths:
      - 'public/design.html'
      - 'public/design/**'
      - 'design.html'
      - 'design/**'
      - 'docs/design.html'
      - 'docs/design/**'
      - 'dist-pages/design.html'
      - 'scripts/sync-design.mjs'
      - 'scripts/build-craft-vault.mts'
      - 'src/components/temari/library.ts'
      - 'Temari-Obsidian/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'public/design.html'
      - 'public/design/**'
      - 'design.html'
      - 'design/**'
      - 'docs/design.html'
      - 'docs/design/**'
      - 'dist-pages/design.html'
      - 'scripts/sync-design.mjs'
      - 'scripts/build-craft-vault.mts'
      - 'src/components/temari/library.ts'
      - 'Temari-Obsidian/**'
      - '.github/workflows/documentation.yml'
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-design.mjs --check
      # карта ремесла собирается из каталога игры: разойтись они не должны
      - run: npm ci
      - run: npx tsx scripts/build-craft-vault.mts --check
